# The whole backend on one machine: the three services plus DynamoDB Local and Valkey, with the free mock
# providers (no Google, OpenAI, or Ticketmaster calls, so it costs nothing).
#
#   cp .env.example .env    # set OKTA_ISSUER and OKTA_AUDIENCE (see docs/OKTA_LOCAL_SETUP.md)
#   docker compose up --build
#
# travel-session listens on http://localhost:8080, the same port the web app's dev server calls.
# The containers run like they do on ECS: non-root, read-only root filesystem, writable /tmp only.

x-service: &service
  read_only: true
  tmpfs:
    - /tmp
  restart: unless-stopped
  environment: &common-env
    OKTA_ISSUER: ${OKTA_ISSUER:?set OKTA_ISSUER in .env}
    OKTA_AUDIENCE: ${OKTA_AUDIENCE:?set OKTA_AUDIENCE in .env}
    LOGGING_LEVEL_COM_AITRAVEL: INFO

services:
  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

  # Creates the sessions table (the same key and TTL attribute as infra/terraform/session-store), then exits.
  dynamodb-init:
    image: amazon/aws-cli:2.27.50
    depends_on:
      - dynamodb
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        for i in $$(seq 1 30); do aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1 && break; sleep 1; done;
        aws dynamodb describe-table --endpoint-url http://dynamodb:8000 --table-name roam-travel-sessions >/dev/null 2>&1 ||
        aws dynamodb create-table --endpoint-url http://dynamodb:8000 --table-name roam-travel-sessions
        --attribute-definitions AttributeName=sessionId,AttributeType=S
        --key-schema AttributeName=sessionId,KeyType=HASH --billing-mode PAY_PER_REQUEST >/dev/null
        && echo "roam-travel-sessions ready"

  valkey:
    image: valkey/valkey:8.1-alpine
    ports:
      - "6379:6379"

  places-discovery:
    <<: *service
    build: services/places-discovery-service
    depends_on:
      - valkey
    environment:
      <<: *common-env
      ATTRACTION_PROVIDER: mock
      EVENTS_PROVIDER: mock
      TRAVEL_REDIS_ENABLED: "true"
      REDIS_HOST: valkey
    ports:
      - "8082:8082"

  recommendation:
    <<: *service
    build: services/recommendation-service
    depends_on:
      - places-discovery
      - valkey
    environment:
      <<: *common-env
      TRAVEL_AI_ENABLED: "false"
      PLACES_DISCOVERY_BASE_URL: http://places-discovery:8082
      TRAVEL_REDIS_ENABLED: "true"
      REDIS_HOST: valkey
    ports:
      - "8081:8081"

  travel-session:
    <<: *service
    build: services/travel-session-service
    depends_on:
      recommendation:
        condition: service_started
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      RECOMMENDATION_SERVICE_BASE_URL: http://recommendation:8081
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      TRAVEL_SESSION_STORE: dynamodb
      TRAVEL_SESSION_DYNAMODB_ENDPOINT: http://dynamodb:8000
      TRAVEL_SESSION_DYNAMODB_REGION: us-east-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "8080:8080"
