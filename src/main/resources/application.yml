spring:
  application:
    name: travel-companion-api
  ai:
    openai:
      # Read from the environment only. Required only when travel.ai.enabled=true.
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${TRAVEL_AI_MODEL:gpt-4o-mini}
    # Spring AI auto-configures every OpenAI model type by default, and each requires a key.
    # Only chat is used. To enable AI, set SPRING_AI_MODEL_CHAT=openai and TRAVEL_AI_ENABLED=true.
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

server:
  port: ${SERVER_PORT:8080}

attraction:
  # Attraction source: "mock" (default, in-memory Rome data) or "google" (Google Places API New).
  provider: ${ATTRACTION_PROVIDER:mock}

google:
  places:
    # Required when attraction.provider=google. Supply via the environment; never commit a key.
    api-key: ${GOOGLE_PLACES_API_KEY:}
    base-url: https://places.googleapis.com
    connect-timeout: 2s
    read-timeout: 5s
    max-result-count: 20
    # Only the fields the mapper uses. Each extra field can increase Google billing.
    field-mask: places.id,places.displayName,places.location,places.types,places.googleMapsUri

recommendation:
  # Maximum straight-line distance from the traveler, in kilometres.
  search-radius-km: ${RECOMMENDATION_SEARCH_RADIUS_KM:5}
  # Walking speed used to estimate travel time to an attraction, in km/h.
  walking-speed-kmh: ${RECOMMENDATION_WALKING_SPEED_KMH:4.5}
  max-recommendations: ${RECOMMENDATION_MAX_RESULTS:3}

travel:
  ai:
    # Off by default. Enable with TRAVEL_AI_ENABLED=true plus SPRING_AI_MODEL_CHAT=openai and OPENAI_API_KEY.
    enabled: ${TRAVEL_AI_ENABLED:false}
    model: ${TRAVEL_AI_MODEL:gpt-4o-mini}
    max-candidates: ${TRAVEL_AI_MAX_CANDIDATES:10}
    max-recommendations: ${TRAVEL_AI_MAX_RECOMMENDATIONS:3}
  session:
    # Active Travel Mode. Sessions live in memory only and are lost on restart.
    minimum-movement-meters: ${TRAVEL_SESSION_MIN_MOVEMENT_METERS:250}
    minimum-refresh-interval-minutes: ${TRAVEL_SESSION_MIN_REFRESH_INTERVAL_MINUTES:5}
    inactivity-timeout-minutes: ${TRAVEL_SESSION_INACTIVITY_TIMEOUT_MINUTES:30}
    # Absolute lifetime, so continuous activity cannot keep a session alive indefinitely.
    max-lifetime-minutes: ${TRAVEL_SESSION_MAX_LIFETIME_MINUTES:120}
    # Expired and stopped sessions answer 410/409 for this long, then return 404.
    retention-after-expiry-minutes: ${TRAVEL_SESSION_RETENTION_MINUTES:30}
    max-active-sessions: ${TRAVEL_SESSION_MAX_ACTIVE:100}
    cleanup-interval-ms: ${TRAVEL_SESSION_CLEANUP_INTERVAL_MS:60000}

management:
  endpoints:
    web:
      # Only the health endpoint is exposed over HTTP; all other actuator endpoints stay disabled.
      exposure:
        include: health
  endpoint:
    health:
      # Keep the response minimal ({"status":"UP"}); do not leak component details.
      show-details: never
