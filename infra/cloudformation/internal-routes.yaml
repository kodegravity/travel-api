AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Exposes the internal Recommendation and Places Discovery endpoints through the existing
  public ALB. Requests must carry an Okta JWT, which the services validate.
  Creates target groups, listener rules, and security group ingress from the ALB.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  ListenerArn:
    Type: String
    Description: ARN of the existing HTTP :80 listener on ai-travel-app-alb.
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  RecommendationSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  PlacesSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  RecommendationRulePriority:
    Type: Number
    Default: 20
  PlacesRulePriority:
    Type: Number
    Default: 30

Resources:
  RecommendationTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: recommendation-tg
      Port: 8081
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'

  PlacesTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: places-tg
      Port: 8082
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'

  RecommendationListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ListenerArn
      Priority: !Ref RecommendationRulePriority
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /internal/v1/recommendations*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref RecommendationTargetGroup

  PlacesListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ListenerArn
      Priority: !Ref PlacesRulePriority
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /internal/v1/places/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref PlacesTargetGroup

  RecommendationIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RecommendationSecurityGroupId
      IpProtocol: tcp
      FromPort: 8081
      ToPort: 8081
      SourceSecurityGroupId: !Ref AlbSecurityGroupId
      Description: ALB to recommendation-service

  PlacesIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref PlacesSecurityGroupId
      IpProtocol: tcp
      FromPort: 8082
      ToPort: 8082
      SourceSecurityGroupId: !Ref AlbSecurityGroupId
      Description: ALB to places-discovery-service

Outputs:
  RecommendationTargetGroupArn:
    Value: !Ref RecommendationTargetGroup
  PlacesTargetGroupArn:
    Value: !Ref PlacesTargetGroup
