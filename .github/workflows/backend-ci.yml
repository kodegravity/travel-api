name: Backend CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, development]
  workflow_dispatch:

# Read-only by default. Only the ecr-push job (master and development pushes) requests an OIDC token; no long-lived AWS keys are stored.
permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pushes to master or development publish images to ECR.
# Each microservice is an independent Maven project with its own Dockerfile and image.
# service: directory under services/; port: container and smoke-test port; ecr_repository: ECR repo for master and development pushes.
jobs:
  build-and-test:
    name: Build and test (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: places-discovery-service
            port: 8082
            ecr_repository: ai-travel-companion-places-discovery
          - service: recommendation-service
            port: 8081
            ecr_repository: ai-travel-companion-recommendation
          - service: travel-session-service
            port: 8080
            ecr_repository: ai-travel-companion-travel-session
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Make Maven Wrapper executable
        working-directory: services/${{ matrix.service }}
        run: chmod +x ./mvnw

      - name: Build and test
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -B -ntp clean verify

      - name: Summarize test results
        if: always()
        working-directory: services/${{ matrix.service }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("target/surefire-reports/TEST-*.xml"))
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for path in files:
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          print("## Unit test results")
          if not files:
              print("No Surefire reports were found.")
          else:
              print(f"Test classes: {len(files)}")
              for key, value in totals.items():
                  print(f"- {key}: {value}")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: Docker build and scan (${{ matrix.service }})
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: places-discovery-service
            port: 8082
          - service: recommendation-service
            port: 8081
          - service: travel-session-service
            port: 8080
    env:
      IMAGE: ${{ matrix.service }}:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Local image only (push: false). The ecr-push job publishes the saved, scanned image.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Verify image runs as non-root
        run: |
          user="$(docker image inspect "$IMAGE" --format '{{.Config.User}}')"
          echo "Image user: $user"
          test "$user" = "10001:10001"

      - name: Smoke test container health
        env:
          PORT: ${{ matrix.port }}
        run: |
          docker run -d --name smoke -p "$PORT:$PORT" \
            -e OKTA_ISSUER=https://smoke.okta.invalid/oauth2/default \
            -e OKTA_AUDIENCE=api://smoke-test \
            "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/actuator/health" | grep -q '"status":"UP"'; then
              echo "Health check passed on attempt $attempt"
              docker stop smoke
              exit 0
            fi
            sleep 2
          done
          echo "Health check did not pass within 60 seconds"
          docker logs smoke
          exit 1

      - name: Scan image for vulnerabilities (report, all severities)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          format: table
          exit-code: '0'

      # Build-blocking policy: CRITICAL or HIGH vulnerabilities that have a published fix fail the job.
      # Vulnerabilities without a fix, and MEDIUM/LOW findings, are reported but do not block.
      - name: Vulnerability gate (CRITICAL/HIGH with fix available)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'

      # Save the exact image that was scanned so the ECR job pushes the same bytes, not a rebuild.
      - name: Save scanned image (master and development)
        if: github.event_name == 'push' && contains(fromJSON('["refs/heads/master","refs/heads/development"]'), github.ref)
        run: docker save "$IMAGE" | gzip > "$RUNNER_TEMP/image.tar.gz"

      - name: Upload scanned image (master and development)
        if: github.event_name == 'push' && contains(fromJSON('["refs/heads/master","refs/heads/development"]'), github.ref)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanned-image-${{ matrix.service }}
          path: ${{ runner.temp }}/image.tar.gz
          if-no-files-found: error
          retention-days: 1

  ecr-push:
    name: Push image to ECR (${{ matrix.service }}, master and development)
    needs: docker-build
    if: github.event_name == 'push' && contains(fromJSON('["refs/heads/master","refs/heads/development"]'), github.ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: places-discovery-service
            ecr_repository: ai-travel-companion-places-discovery
          - service: recommendation-service
            ecr_repository: ai-travel-companion-recommendation
          - service: travel-session-service
            ecr_repository: ai-travel-companion-travel-session
    # id-token: write lets this job request a short-lived OIDC token. No AWS access keys are stored in GitHub.
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      AWS_ROLE_ARN: arn:aws:iam::512383926725:role/ai-travel-companion-ecr-push
      ECR_REPOSITORY: ${{ matrix.ecr_repository }}
    steps:
      - name: Download scanned image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scanned-image-${{ matrix.service }}
          path: ${{ runner.temp }}

      - name: Load scanned image
        run: gunzip -c "$RUNNER_TEMP/image.tar.gz" | docker load

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ecr-push-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Tag and push image by commit SHA
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SOURCE_IMAGE: ${{ matrix.service }}:${{ github.sha }}
        run: |
          target="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          # Tags are immutable in ECR, so skip if this commit was already published (e.g. a re-run).
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Tag $GITHUB_SHA already exists in ECR; skipping push."
            exit 0
          fi
          docker tag "$SOURCE_IMAGE" "$target"
          docker push "$target"
          echo "Pushed $target"
