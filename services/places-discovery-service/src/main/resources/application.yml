spring:
  application:
    name: places-discovery-service
  lifecycle:
    timeout-per-shutdown-phase: 25s
  data:
    redis:
      # ElastiCache Valkey in AWS (TLS); a plain local Redis otherwise. Only used when travel.redis.enabled=true.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL:false}
      # Short, so a slow or missing Redis costs a request at most this long before falling back to local state.
      connect-timeout: 1s
      timeout: 500ms
  security:
    oauth2:
      resourceserver:
        jwt:
          # Okta authorization server issuer, e.g. https://your-domain.okta.com/oauth2/default. Required.
          issuer-uri: ${OKTA_ISSUER:}

travel:
  redis:
    # Shares daily call caps across tasks and restarts, and caches small lookups. Off: each task counts on its own.
    enabled: ${TRAVEL_REDIS_ENABLED:false}
  warmup:
    # Background warm-up after startup (Okta keys, first downstream connection).
    enabled: ${TRAVEL_WARMUP_ENABLED:true}
  security:
    # Expected "aud" claim in Okta access tokens. Required.
    audience: ${OKTA_AUDIENCE:}
    # Optional scope every /internal/v1 call must carry. Leave empty to accept any valid token.
    required-scope: ${TRAVEL_REQUIRED_SCOPE:}

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

attraction:
  # "mock" (default, no credentials needed) or "google".
  provider: ${ATTRACTION_PROVIDER:mock}

google:
  places:
    # Required when attraction.provider=google. Supply via the environment; never commit a key.
    api-key: ${GOOGLE_PLACES_API_KEY:}
    base-url: https://places.googleapis.com
    connect-timeout: 2s
    read-timeout: 5s
    max-result-count: 20
    # Only fields the app uses. Every field here is billed, so add new ones deliberately.
    field-mask: places.id,places.displayName,places.location,places.types
    # Hard cap on Google requests per UTC day, per task (cost control). Past it, searches return 503.
    max-calls-per-day: ${GOOGLE_PLACES_MAX_CALLS_PER_DAY:190}
    details:
      # Hard cap on Place Details lookups per UTC day, per task. Each lookup also fetches at most one photo.
      # 30/day stays inside Google's free 1,000/month for both the Enterprise + Atmosphere and Photos SKUs.
      max-calls-per-day: ${GOOGLE_PLACE_DETAILS_MAX_CALLS_PER_DAY:30}
      # Hard cap on Place Photos per UTC day, per task, shared by the details page and the place cards.
      # 30/day stays inside the free 1,000/month.
      photos-max-per-day: ${GOOGLE_PLACE_PHOTOS_MAX_CALLS_PER_DAY:30}
  routes:
    # Route optimizations (Google Routes API, same key; enable "Routes API" on it). Hard cap per UTC day, per task.
    # 20/day stays inside the free 1,000/month even at the Compute Routes Enterprise rate.
    max-calls-per-day: ${GOOGLE_ROUTES_MAX_CALLS_PER_DAY:20}

events:
  # "mock" (default, sample events, no key), "ticketmaster" (free API key), or "none".
  provider: ${EVENTS_PROVIDER:mock}
  # Required when events.provider=ticketmaster. Supply via the environment; never commit a key.
  api-key: ${TICKETMASTER_API_KEY:}
  # Hard cap on Ticketmaster calls per UTC day, per task. The free tier allows 5,000.
  max-calls-per-day: ${EVENTS_MAX_CALLS_PER_DAY:1000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # Boot 4 lists the liveness/readiness probe groups in the root response; this service has no k8s probes.
      probes:
        enabled: false
  health:
    # Redis is optional (callers fall back to local state), so its outage must not fail the ECS health check.
    redis:
      enabled: false
logging:
  level:
    com.aitravel: ${LOGGING_LEVEL_COM_AITRAVEL:INFO}
