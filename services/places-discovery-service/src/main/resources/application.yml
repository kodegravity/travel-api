spring:
  application:
    name: places-discovery-service
  lifecycle:
    timeout-per-shutdown-phase: 25s
  security:
    oauth2:
      resourceserver:
        jwt:
          # Okta authorization server issuer, e.g. https://your-domain.okta.com/oauth2/default. Required.
          issuer-uri: ${OKTA_ISSUER:}

travel:
  security:
    # Expected "aud" claim in Okta access tokens. Required.
    audience: ${OKTA_AUDIENCE:}
    # Optional scope every /internal/v1 call must carry. Leave empty to accept any valid token.
    required-scope: ${TRAVEL_REQUIRED_SCOPE:}

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

attraction:
  # "mock" (default, no credentials needed) or "google".
  provider: ${ATTRACTION_PROVIDER:mock}

google:
  places:
    # Required when attraction.provider=google. Supply via the environment; never commit a key.
    api-key: ${GOOGLE_PLACES_API_KEY:}
    base-url: https://places.googleapis.com
    connect-timeout: 2s
    read-timeout: 5s
    max-result-count: 20
    field-mask: places.id,places.displayName,places.location,places.types,places.googleMapsUri

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # Boot 4 lists the liveness/readiness probe groups in the root response; this service has no k8s probes.
      probes:
        enabled: false
