spring:
  cloud:
    aws:
      # Spring Cloud AWS clients exist only with messaging on; credentials and region come from the default chain.
      sns:
        enabled: ${TRAVEL_MESSAGING_ENABLED:false}
      sqs:
        enabled: ${TRAVEL_MESSAGING_ENABLED:false}
  application:
    name: travel-session-service
  lifecycle:
    timeout-per-shutdown-phase: 25s
  security:
    oauth2:
      resourceserver:
        jwt:
          # Okta authorization server issuer, e.g. https://your-domain.okta.com/oauth2/default. Required.
          issuer-uri: ${OKTA_ISSUER:}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

recommendation-service:
  base-url: ${RECOMMENDATION_SERVICE_BASE_URL:http://localhost:8081}
  connect-timeout: 2s
  read-timeout: 10s

travel:
  messaging:
    # Event-driven messaging (SNS out, SQS in). Off by default: no outbox writes, publishing, or consuming.
    enabled: ${TRAVEL_MESSAGING_ENABLED:false}
    # The travel events topic, from Terraform (infra/terraform/messaging). Required when enabled.
    topic-arn: ${TRAVEL_MESSAGING_TOPIC_ARN:}
    notification-queue: ${TRAVEL_MESSAGING_NOTIFICATION_QUEUE:roam-notification-events}
    # How often the outbox relay sweeps for events the fast path could not publish.
    relay-interval-ms: ${TRAVEL_MESSAGING_RELAY_INTERVAL_MS:30000}
  warmup:
    # Background warm-up after startup (Okta keys, first downstream connection).
    enabled: ${TRAVEL_WARMUP_ENABLED:true}
  security:
    # Expected "aud" claim in Okta access tokens. Required.
    audience: ${OKTA_AUDIENCE:}
    # Optional scope every /api/v1 call must carry. Leave empty to accept any valid token.
    required-scope: ${TRAVEL_REQUIRED_SCOPE:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  session:
    minimum-movement-meters: ${TRAVEL_SESSION_MIN_MOVEMENT_METERS:250}
    minimum-refresh-interval-minutes: ${TRAVEL_SESSION_MIN_REFRESH_INTERVAL_MINUTES:5}
    inactivity-timeout-minutes: ${TRAVEL_SESSION_INACTIVITY_TIMEOUT_MINUTES:30}
    max-lifetime-minutes: ${TRAVEL_SESSION_MAX_LIFETIME_MINUTES:120}
    retention-after-expiry-minutes: ${TRAVEL_SESSION_RETENTION_MINUTES:30}
    max-active-sessions: ${TRAVEL_SESSION_MAX_ACTIVE:100}
    cleanup-interval-ms: ${TRAVEL_SESSION_CLEANUP_INTERVAL_MS:60000}
    refresh-lease-seconds: ${TRAVEL_SESSION_REFRESH_LEASE_SECONDS:30}
    # "memory" (default, single task, lost on restart) or "dynamodb" (shared, survives restarts).
    store: ${TRAVEL_SESSION_STORE:memory}
    dynamodb:
      table-name: ${TRAVEL_SESSION_TABLE:roam-travel-sessions}
      # Blank uses AWS_REGION. Set the endpoint only for DynamoDB Local, e.g. http://localhost:8000.
      region: ${TRAVEL_SESSION_DYNAMODB_REGION:}
      endpoint: ${TRAVEL_SESSION_DYNAMODB_ENDPOINT:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false
logging:
  level:
    com.aitravel: ${LOGGING_LEVEL_COM_AITRAVEL:INFO}
