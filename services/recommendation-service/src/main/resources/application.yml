spring:
  cloud:
    aws:
      # The SQS client exists only with messaging on; credentials and region come from the default chain.
      sqs:
        enabled: ${TRAVEL_MESSAGING_ENABLED:false}
  application:
    name: recommendation-service
  lifecycle:
    timeout-per-shutdown-phase: 25s
  security:
    oauth2:
      resourceserver:
        jwt:
          # Okta authorization server issuer, e.g. https://your-domain.okta.com/oauth2/default. Required.
          issuer-uri: ${OKTA_ISSUER:}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${TRAVEL_AI_MODEL:gpt-4o-mini}
          # Caps output tokens per call (cost control). Three short reasons fit comfortably.
          max-tokens: ${TRAVEL_AI_MAX_TOKENS:500}
    model:
      chat: ${SPRING_AI_MODEL_CHAT:openai}
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

places:
  discovery:
    base-url: ${PLACES_DISCOVERY_BASE_URL:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 8s

recommendation:
  search-radius-km: ${RECOMMENDATION_SEARCH_RADIUS_KM:5}
  walking-speed-kmh: ${RECOMMENDATION_WALKING_SPEED_KMH:4.5}
  # Google returns at most 20 places per search, so 20 means "every eligible place". travel-session pages them.
  max-recommendations: ${RECOMMENDATION_MAX_RESULTS:20}

travel:
  messaging:
    # Consume TravelSessionStarted from SQS to warm up the AI paths. Off by default.
    enabled: ${TRAVEL_MESSAGING_ENABLED:false}
    session-queue: ${TRAVEL_MESSAGING_SESSION_QUEUE:roam-recommendation-events}
  warmup:
    # Background warm-up after startup (Okta keys, first downstream connection).
    enabled: ${TRAVEL_WARMUP_ENABLED:true}
  security:
    # Expected "aud" claim in Okta access tokens. Required.
    audience: ${OKTA_AUDIENCE:}
    # Optional scope every /internal/v1 call must carry. Leave empty to accept any valid token.
    required-scope: ${TRAVEL_REQUIRED_SCOPE:}
  ai:
    enabled: ${TRAVEL_AI_ENABLED:false}
    model: ${TRAVEL_AI_MODEL:gpt-4o-mini}
    max-candidates: ${TRAVEL_AI_MAX_CANDIDATES:10}
    max-recommendations: ${TRAVEL_AI_MAX_RECOMMENDATIONS:3}
    # Hard cap on OpenAI calls per UTC day, per task. Past it, deterministic ranking is used.
    max-calls-per-day: ${TRAVEL_AI_MAX_CALLS_PER_DAY:300}
    # Longest wait for one OpenAI reply. Past it, deterministic ranking is returned.
    timeout: ${TRAVEL_AI_TIMEOUT:4s}
  live:
    # Live event alerts in Travel Mode: events within this radius, starting within these hours.
    radius-km: ${TRAVEL_LIVE_RADIUS_KM:5}
    hours: ${TRAVEL_LIVE_HOURS:6}
    # Hard cap on OpenAI calls for live alerts per UTC day, per task. Past it, rule-based picks are used.
    ai-max-calls-per-day: ${TRAVEL_LIVE_AI_MAX_CALLS_PER_DAY:100}
  chat:
    # "Ask ROAM" chat: hard cap on OpenAI replies per UTC day, per task. Past it, rule-based replies are used.
    ai-max-calls-per-day: ${TRAVEL_CHAT_AI_MAX_CALLS_PER_DAY:200}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false
logging:
  level:
    com.aitravel: ${LOGGING_LEVEL_COM_AITRAVEL:INFO}
