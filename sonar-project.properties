# SonarQube Cloud analysis of the three services as one project. The organization and project key come from the
# SONAR_ORGANIZATION and SONAR_PROJECT_KEY repository variables (see .github/workflows/backend-ci.yml).
sonar.projectName=ROAM AI backend
sonar.sourceEncoding=UTF-8
sonar.java.source=21

sonar.sources=\
  services/places-discovery-service/src/main,\
  services/recommendation-service/src/main,\
  services/travel-session-service/src/main
sonar.tests=\
  services/places-discovery-service/src/test,\
  services/recommendation-service/src/test,\
  services/travel-session-service/src/test

sonar.java.binaries=\
  services/places-discovery-service/target/classes,\
  services/recommendation-service/target/classes,\
  services/travel-session-service/target/classes
sonar.java.test.binaries=\
  services/places-discovery-service/target/test-classes,\
  services/recommendation-service/target/test-classes,\
  services/travel-session-service/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=\
  services/places-discovery-service/target/site/jacoco/jacoco.xml,\
  services/recommendation-service/target/site/jacoco/jacoco.xml,\
  services/travel-session-service/target/site/jacoco/jacoco.xml

# Entry points and generated wiring add noise to coverage without being worth unit tests.
sonar.coverage.exclusions=**/*Application.java,**/config/**
